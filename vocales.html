<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadro de vocales</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf9f6;--fg:#222;--card:#fff;--line:#bbb;--muted:#666}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#eee;--card:#2a2a2d;--line:#555;--muted:#aaa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#eee;--card:#2a2a2d;--line:#555;--muted:#aaa}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.2rem;margin:4px 0}
p{color:var(--muted);font-size:.9rem;max-width:420px;text-align:center;margin:4px 0 12px}
#pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.sw{border:3px solid transparent;border-radius:10px;padding:6px 10px;color:#000;font-weight:600;cursor:pointer;font-size:.85rem}
.sw.on{border-color:var(--fg)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:min(92vw,380px)}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(1.4rem,7vw,2rem);font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;color:var(--fg)}
.c.s{color:#000}
#info{margin-top:14px;width:min(92vw,380px);font-size:.85rem}
.row{display:flex;align-items:center;gap:8px;margin:3px 0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
#msg{margin-top:10px;font-weight:700;min-height:1.4em}
button.r{margin-top:8px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
</style></head><body>
<h1>Cuadro de vocales</h1>
<p>Elige un color y toca celdas para agrupar 5 vocales distintas y conectadas (arriba, abajo, izquierda o derecha). Toca otra vez para quitar.</p>
<div id="pal"></div>
<div id="cnt" style="font-weight:700;margin-bottom:10px"></div>
<div id="grid"></div>
<div id="info"></div>
<div id="msg"></div>
<button class="r" id="rs">Reiniciar</button>
<script>
const L="EAIOI UEUEO OIAOA IUEAI AOUEU".replace(/ /g,"").split("");
const COL=["#ff8a80","#82b1ff","#b9f6ca","#ffe57f","#ce93d8"];
const NAME=["Rojo","Azul","Verde","Amarillo","Morado"];
let g=Array(25).fill(-1),cur=0;
const pal=document.getElementById("pal"),grid=document.getElementById("grid"),info=document.getElementById("info"),msg=document.getElementById("msg");
COL.forEach((c,i)=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.textContent=NAME[i];b.onclick=()=>{cur=i;draw()};pal.appendChild(b)});
L.forEach((v,i)=>{const d=document.createElement("div");d.className="c";d.textContent=v;d.onclick=()=>{
 if(g[i]===cur)g[i]=-1;
 else if(g.filter(x=>x===cur).length<5)g[i]=cur;
 draw()};grid.appendChild(d)});
function conn(cells){if(!cells.length)return false;const s=new Set(cells),seen=new Set([cells[0]]),q=[cells[0]];
 while(q.length){const n=q.pop(),r=Math.floor(n/5),c=n%5;
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,b])=>{if(a<0||b<0||a>4||b>4)return;const k=a*5+b;if(s.has(k)&&!seen.has(k)){seen.add(k);q.push(k)}})}
 return seen.size===cells.length}
function draw(){
 [...pal.children].forEach((b,i)=>b.classList.toggle("on",i===cur));
 [...grid.children].forEach((d,i)=>{d.classList.toggle("s",g[i]>=0);d.style.background=g[i]>=0?COL[g[i]]:""});
 let ok=0;info.innerHTML="";
 for(let k=0;k<5;k++){
  const cs=g.map((x,i)=>x===k?i:-1).filter(i=>i>=0),v=new Set(cs.map(i=>L[i]));
  let t;
  if(cs.length<5)t=cs.length+"/5";
  else if(v.size<5)t="vocales repetidas";
  else if(!conn(cs))t="no conectadas";
  else{t="✓ correcto";ok++}
  info.innerHTML+=`<div class="row"><span class="dot" style="background:${COL[k]}"></span>${NAME[k]}: ${t}${cs.length&&cs.length<5?" ("+[...v].join(" ")+")":""}</div>`}
 document.getElementById("cnt").textContent="Grupos correctos: "+ok+"/5";
 msg.textContent=ok===5?"🎉 ¡Resuelto!":"";
}
document.getElementById("rs").onclick=()=>{g.fill(-1);draw()};
draw();
</script></body></html>
